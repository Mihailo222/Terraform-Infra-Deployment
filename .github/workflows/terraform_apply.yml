name: 'Terraform'

on:

  # Kada se PR merge-uje u main -> pokreće se push event
  workflow_dispatch:

    
  push:
    branches: [ "main" ]

    paths:
      - 'aks-deployment/**'
      - '.github/workflows/terraform-apply.yml'

  # Kada se napravi/update-uje PR prema main
  
  pull_request:
    branches:
      - main

    paths:
      - 'aks-deployment/**'
      - '.github/workflows/terraform-apply.yml'

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_vm1_ssh_public_key_path: ${{ secrets.VM_SSH_PUBLIC_KEY }}
      TF_VAR_vm2_ssh_public_key_path: ${{ secrets.VM_SSH_PUBLIC_KEY }}

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1
#      with:
#        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init
      working-directory: ${{ github.workspace }}/aks-deployment

    # Checks that all Terraform configuration files adhere to a canonical format
#    - name: Terraform Format
#      run: terraform fmt -check
#      working-directory: ${{ github.workspace }}/aks-deployment


    - name: Terraform Validate
      run: terraform validate
      working-directory: ${{ github.workspace }}/aks-deployment

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform plan -input=false
      working-directory: ${{ github.workspace }}/aks-deployment


# APPLY SE DESAVA SAMO NA PUSH NA MAIN

    - name: Terraform Apply
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: terraform apply -input=false -auto-approve
      working-directory: ${{ github.workspace }}/aks-deployment
 
 #   - name: Terraform Apply
 #     run: terraform apply -auto-approve -input=false
 #     working-directory: ${{ github.workspace }}/aks-deployment      

#    - name: Terraform Destroy
#      run: terraform destroy -auto-approve -input=false
#      working-directory: ${{ github.workspace }}/aks-deployment  

