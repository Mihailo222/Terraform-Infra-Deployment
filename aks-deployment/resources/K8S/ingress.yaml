apiVersion: networking.k8s.io/v1 
kind: Ingress 
metadata: 
  name: prometheus-grafana
spec: 
  ingressClassName: nginx
  rules: 
  - host: my-grafana.ui 
    http:
      paths:
      - path: /
        pathType: Prefix 
        backend:
          service:
            name: prometheus-grafana
            port:
              number: 80

