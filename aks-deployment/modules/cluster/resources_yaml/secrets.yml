# mzes i docker config file da uguras kao secret file:

apiVersion: v1 
kind: Secret 
metadata: 
  name: dockerconfigjson
type: kubernetes.io/dockerconfigjson
data: 
  .dockerconfigjson: |
    <base64 encoded json ocker >

