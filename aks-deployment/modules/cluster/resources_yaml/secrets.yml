# secrets

# they are similar to CM but with one main difference - data is base64 encoded ( this is not a security mechanism, it's to support binary data)
# they can be managed with specific authorization cause they are separate resource type

apiVersion: v1 
kind: Secret 
metadata: 
  name: string-data 
type: Opaque 
stringData:
  foo: bar 


apiVersion: v1 
kind: Secret 
metadata:
  name: base64-data 
type: Opaque 
data:
  foo: YmFy 



apiVersion: v1 
kind: Pod 
metadata: 
  name: secret-example 
spec: 
  containers: 
    - name: nginx 
      image: nginx:1.26.0 
      volumeMounts:
        - name: secret-base64-data
          mountPath: /etc/config 

      env: 
        - name: ENV_VAR_FROM_SECRET
          valueFrom:
            secretKeyRef: 
              name: base64-data 
              key: foo

  volumes: 
    - name: secret-base64-data
      secret:  
        secretName: base64-data 

# kubectl get secrets -o yaml | yq 
# kubectl get secrets string-data -o yaml | yq '.data.foo' | base64 -d 

