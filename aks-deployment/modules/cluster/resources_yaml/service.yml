# services

# services su load balanceri unutar klastera izmedju replika
# koriste pod labels da odluce koji podovi ce da primaju taj saobracaj
# Tipovi:
#1. clusterIP -> internal to cluster
#2. NodePort -> listens on each node in cluster, moras da dodas mozda i firewall rules za ovo !!!
#3. LoadBalancer -> provisions external lb ( cloud provider )

apiVersion: v1 
kind: Service 
metadata: 
  name: nginx-service
spec: 
  type: clusterIP
  selector: 
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

apiVersion: v1 
kind: Service
metadata:
  name: nginx-service-nodeport
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
     # nodePort: 30001 -> always beyond 30000-32767 range, if not specified, it will be randomly assigned in that range; you can assign a specific port also

apiVersion: v1
kind: Service
metadata:
  name: nginx-service-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:  
    - protocol: TCP
      port: 80
      targetPort: 80

#Create deployment that's going to host pods and rss based on matching labels. Create  service that will load balance traffic to those pods. Service will use label selector to find pods with matching labels and send traffic to them. Service will have a clusterIP, nodePort or loadBalancer type depending on how you want to expose it.


#example of the deployment we want to expose with service

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-minimal
  labels: 
    foo: deployment-label # a ovo je samo deployment label, samo selector label je bitan za podove koje gleda selector da bi dohvatio deployment 
  annotations:
    bar: deployment-annotation
spec:
  replicas: 3
  selector:
    matchLabels:
    baz: pod-label #selector trazi podove sa ovom labelom i baca ih u deployment
  template:
    metadata:
      labels:
        baz: pod-label
      annotations:
        bing: pod-annotation
    spec:
      containers:
       - name: nginx 
         image: nginx:1.26.0
