#daemonsets

# runuje kopiju poda na svakom nodu u clusteru
# za aplikacije kod kojih pod mora biti na svakom nodu (npr. monitoring agenti, log agenti, storage driveri, network pluginovi)

apiKind: apps/v1
kind: DaemonSet
metadata:
  name: example-daemonset
  namespace: example-namespace
spec:
  selector:
    matchLabels:
      app: example-app
  template:
    metadata:
      labels:
        app: example-app
    spec:   
      containers:
      - name: example-container
        image: nginx:latest