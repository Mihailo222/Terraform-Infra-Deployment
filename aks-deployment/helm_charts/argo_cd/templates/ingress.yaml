
{{- if .Values.customIngressResource.enabled }}

apiVersion: networking.k8s.io/v1 
kind: Ingress 
metadata: 
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    kubernetes.io/ingress.allow-http: "false"
  name: {{ .Values.customIngressResource.service.name }}
  namespace: {{ .Values.customIngressResource.service.servicenamespace }}
spec: 
  ingressClassName: {{ .Values.customIngressResource.ingressClassName }}
  rules: 
  - host: "argocd.local"
    http:
      paths:
      - path: /
        pathType: Prefix 
        backend:
          service:
            name: {{ .Values.customIngressResource.service.name }}
            port:
              number: {{ .Values.customIngressResource.service.port }}
{{- end }}